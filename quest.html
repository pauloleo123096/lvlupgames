<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Critical Choice for Yang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #0f172a; 
            color: white; 
            font-family: 'Inter', sans-serif; 
            margin: 0;
            padding: 0;
            overflow: hidden; 
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gamer-font { font-family: 'Rajdhani', sans-serif; }
        
        /* This ensures the NO button is visible at the start */
        #no-btn { 
            transition: all 0.1s ease-out; 
            z-index: 50; 
            white-space: nowrap;
            position: relative; /* Starts relative so it sits next to YES */
        }
        
        #yes-btn { 
            transition: all 0.2s ease-in-out; 
            z-index: 60; 
            position: relative;
        }

        .confetti { position: absolute; animation: fall 3s linear forwards; z-index: 100; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
    </style>
</head>
<body>

    <div id="main-container" class="text-center p-6 w-full max-w-4xl">
        <h1 class="gamer-font text-4xl md:text-6xl mb-16 uppercase tracking-widest text-violet-400">
            Critical Choice: How would you describe yourself now?
        </h1>
        
        <div id="button-area" class="flex justify-center items-center gap-10 min-h-[300px]">
            
            <button id="yes-btn" onclick="victory()" 
                class="bg-green-500 hover:bg-green-400 text-white font-bold py-4 px-10 rounded-full shadow-[0_0_20px_rgba(34,197,94,0.5)] text-2xl">
                TIGULANG!
            </button>

            <button id="no-btn" onmouseover="evade()" onclick="evade()"
                class="bg-red-600 text-white font-bold py-4 px-10 rounded-full shadow-lg text-xl">
                YOUNG
            </button>

        </div>
    </div>

    <script>
        let scale = 1;
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');

        function evade() {
            // Immediately switch to fixed position so it can move anywhere
            noBtn.style.position = 'fixed';

            // Calculate random position but keep it within the visible screen
            const padding = 100;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;
            
            const newX = Math.max(padding, Math.random() * maxX);
            const newY = Math.max(padding, Math.random() * maxY);
            
            noBtn.style.left = `${newX}px`;
            noBtn.style.top = `${newY}px`;

            // Make YES button grow
            scale += 0.4;
            yesBtn.style.transform = `scale(${scale})`;

            // Change the text as it gets bigger
            if (scale > 2.5) yesBtn.innerText = "CLICK ME!!!";
            if (scale > 5) yesBtn.innerText = "GIVE UP, YANG!";
        }

        function victory() {
            const container = document.getElementById('main-container');
            // Remove the NO button entirely
            noBtn.style.display = 'none';
            
            container.innerHTML = `
                <h1 class="gamer-font text-6xl md:text-8xl text-green-400 animate-bounce mb-4">I thought so.!</h1>
                <p class="text-2xl text-violet-300">Happy Birthday, Yang! Keep your youthful spirit on the highest energy ever. Cheers to more years as an adult.</p>
                <div class="mt-10 text-8xl">🎂🎮✨</div>
            `;
            
            // Celebration Confetti
            for(let i=0; i<100; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.innerText = ['💜', '🎮', '✨', '🎂'][Math.floor(Math.random() * 4)];
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-5vh';
                confetti.style.fontSize = Math.random() * 20 + 20 + 'px';
                confetti.style.animationDuration = Math.random() * 2 + 2 + 's';
                document.body.appendChild(confetti);
            }
        }
    </script>
</body>
</html>
