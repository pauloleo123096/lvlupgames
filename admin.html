<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM Terminal | LVLUP Games</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; }
        h1, .brand { font-family: 'Rajdhani', sans-serif; }
        .admin-border { border: 1px solid #1e293b; transition: all 0.3s; }
        .admin-border:focus-within { border-color: #8b5cf6; box-shadow: 0 0 10px rgba(139, 92, 246, 0.2); }
    </style>
</head>
<body class="p-8">
    <div class="max-w-2xl mx-auto">
        <div class="brand text-2xl font-bold text-violet-500 mb-8 tracking-tighter uppercase">GM_TERMINAL <span class="text-white">v1.0</span></div>
        
        <h1 class="text-4xl font-bold mb-2 uppercase italic text-white">Post New Quest</h1>
        <p class="text-gray-500 mb-10">Client requests posted here will appear on the public Guild Board.</p>

        <form class="space-y-6">
            <div class="grid md:grid-cols-2 gap-6">
                <div class="flex flex-col gap-2">
                    <label class="text-xs font-bold text-violet-400 uppercase">Quest Title</label>
                    <input type="text" placeholder="e.g. The Slime Infestation" class="bg-slate-900 admin-border p-3 rounded-lg outline-none text-sm">
                </div>
                <div class="flex flex-col gap-2">
                    <label class="text-xs font-bold text-violet-400 uppercase">Bounty (Points)</label>
                    <input type="number" placeholder="5000" class="bg-slate-900 admin-border p-3 rounded-lg outline-none text-sm">
                </div>
            </div>

            <div class="flex flex-col gap-2">
                <label class="text-xs font-bold text-violet-400 uppercase">Short Description</label>
                <textarea rows="3" placeholder="Briefly describe the client's problem..." class="bg-slate-900 admin-border p-3 rounded-lg outline-none text-sm"></textarea>
            </div>

            <div class="grid md:grid-cols-2 gap-6">
                <div class="flex flex-col gap-2">
                    <label class="text-xs font-bold text-violet-400 uppercase">Min Party Size</label>
                    <input type="number" value="1" class="bg-slate-900 admin-border p-3 rounded-lg outline-none text-sm">
                </div>
                <div class="flex flex-col gap-2">
                    <label class="text-xs font-bold text-violet-400 uppercase">Max Party Size</label>
                    <input type="number" value="4" class="bg-slate-900 admin-border p-3 rounded-lg outline-none text-sm">
                </div>
            </div>

            <button type="submit" class="w-full bg-violet-600 hover:bg-violet-700 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-violet-500/20 uppercase tracking-widest">
                Deploy to Board
            </button>
        </form>
    </div>
</body>
</html>
