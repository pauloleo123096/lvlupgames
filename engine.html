<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LVLUP | Incoming Quest...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Inter', sans-serif; overflow: hidden; }
        .gamer-font { font-family: 'Rajdhani', sans-serif; }
        .btn-evasive { transition: all 0.15s ease; position: absolute; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(139, 92, 246, 0.3); backdrop-filter: blur(12px); }
        .text-glow { text-shadow: 0 0 20px rgba(139, 92, 246, 0.5); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="questCard" class="glass-panel p-8 md:p-12 rounded-[2.5rem] max-w-lg w-full text-center shadow-2xl relative z-10">
        <h3 id="recipientDisplay" class="text-violet-400 uppercase tracking-[0.3em] font-bold text-[10px] mb-4">Message for Patrixja</h3>
        <h1 id="questionDisplay" class="gamer-font text-4xl md:text-5xl font-black uppercase mb-12 leading-tight text-glow">Will you be my Player 2?</h1>
        
        <div class="flex flex-col md:flex-row gap-4 justify-center items-center min-h-[150px]">
            <button id="yesBtn" onclick="celebrate()" class="w-full md:w-auto bg-gradient-to-r from-green-500 to-emerald-600 px-12 py-4 rounded-2xl font-bold uppercase tracking-widest hover:scale-110 transition-transform shadow-lg shadow-green-500/20">
                YES!
            </button>
            
            <button id="noBtn" onmouseover="moveButton()" class="w-full md:w-auto bg-slate-700 px-12 py-4 rounded-2xl font-bold uppercase tracking-widest pointer-events-auto">
                NO
            </button>
        </div>
    </div>

    <div id="victoryOverlay" class="fixed inset-0 bg-slate-950 flex flex-col items-center justify-center z-50 hidden p-6 text-center">
        <div class="animate-bounce mb-8 text-6xl">🎉</div>
        <h2 class="gamer-font text-5xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-violet-400 to-indigo-400 uppercase mb-6">Success!</h2>
        <p id="victoryMessage" class="max-w-md text-slate-300 text-lg leading-relaxed mb-12">The best co-op journey begins now!</p>
        <a href="index.html" class="text-[10px] text-slate-600 uppercase tracking-widest font-bold border border-slate-800 px-6 py-3 rounded-full hover:text-white hover:border-white transition">Return to LVLUP Hub</a>
    </div>

    <script>
        // 1. Decode URL Data
        const urlParams = new URLSearchParams(window.location.search);
        const encodedData = urlParams.get('data');
        
        let questData = {
            n: "Player",
            q: "Will you join the guild?",
            y: "YES!",
            no: "NO",
            v: "Welcome to the team!"
        };

        if (encodedData) {
            try {
                questData = JSON.parse(decodeURIComponent(escape(atob(encodedData))));
            } catch (e) {
                console.error("Data corruption detected.");
            }
        }

        // 2. Inject Data into DOM
        document.getElementById('recipientDisplay').innerText = `Message for ${questData.n}`;
        document.getElementById('questionDisplay').innerText = questData.q;
        document.getElementById('yesBtn').innerText = questData.y;
        document.getElementById('noBtn').innerText = questData.no;
        document.getElementById('victoryMessage').innerText = questData.v;

        // 3. Evasive Logic
        const noBtn = document.getElementById('noBtn');
        
        function moveButton() {
            // Change to absolute positioning on first move
            noBtn.classList.add('btn-evasive');
            
            const padding = 50;
            const maxWidth = window.innerWidth - noBtn.offsetWidth - padding;
            const maxHeight = window.innerHeight - noBtn.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxWidth));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxHeight));

            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
        }

        function celebrate() {
            document.getElementById('victoryOverlay').classList.remove('hidden');
            // Basic Confetti Effect could be added here
        }
    </script>
</body>
</html>
