<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact LVLUP Games</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .gamer-font { font-family: 'Rajdhani', sans-serif; }
    </style>
</head>
<body class="selection:bg-violet-500 selection:text-white flex flex-col min-h-screen">

    <nav class="flex items-center justify-between px-8 py-6 max-w-7xl mx-auto border-b border-slate-800/50 w-full">
        <div class="gamer-font text-3xl font-bold tracking-tighter text-violet-500 w-48">
            <a href="index.html">LVLUP<span class="text-white">GAMES</span></a>
        </div>
        <div class="hidden md:flex space-x-8 font-medium text-xs uppercase tracking-widest justify-center flex-1">
            <a href="index.html" class="hover:text-violet-400 transition">Library</a>
            <a href="spinner.html" class="hover:text-violet-400 transition">Loot Spinner</a>
            <a href="builder.html" class="hover:text-violet-400 transition">Prank Builder</a>
            <a href="blog/index.html" class="hover:text-violet-400 transition">Blog</a>
        </div>
        <div class="w-48 hidden md:flex justify-end items-center">
            <a href="https://pro.lvlupgames.org" class="gamer-font text-xl font-bold tracking-tighter border border-slate-700 hover:border-cyan-400 bg-slate-900/50 hover:bg-slate-800 px-4 py-1.5 rounded-lg transition-all text-white flex items-center shadow-lg shadow-cyan-500/10">
                LVLUP<span class="text-cyan-400 ml-1">PRO</span>
            </a>
        </div>
    </nav>

    <main class="max-w-xl mx-auto py-20 px-6 flex-grow w-full">
        <h1 class="gamer-font text-5xl font-black uppercase mb-8 border-b border-slate-800 pb-6">Initialize <span class="text-violet-500">Contact.</span></h1>
        
        <form action="https://api.web3forms.com/submit" method="POST" class="space-y-6">
            <input type="hidden" name="access_key" value="d18bfd65-9618-428a-88c0-e6011ec0f238">
            <input type="hidden" name="redirect" value="https://lvlupgames.org">
            
            <div>
                <label class="text-[10px] uppercase tracking-widest font-bold text-gray-500 block mb-2">Identification</label>
                <input type="text" name="name" required placeholder="Your Name or Gamertag" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-4 outline-none focus:border-violet-500 transition text-sm">
            </div>
            
            <div>
                <label class="text-[10px] uppercase tracking-widest font-bold text-gray-500 block mb-2">Comms Address</label>
                <input type="email" name="email" required placeholder="email@example.com" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-4 outline-none focus:border-violet-500 transition text-sm">
            </div>

            <div>
                <label class="text-[10px] uppercase tracking-widest font-bold text-gray-500 block mb-2">Transmission Details</label>
                <textarea name="message" required rows="5" placeholder="Bug reports, feature requests, or business inquiries..." class="w-full bg-slate-900 border border-slate-800 rounded-xl p-4 outline-none focus:border-violet-500 transition text-sm"></textarea>
            </div>

            <button type="submit" class="w-full bg-violet-600 hover:bg-violet-500 text-white font-bold py-4 rounded-xl uppercase tracking-widest text-sm transition-all shadow-lg shadow-violet-500/20">Submit Transmission</button>
        </form>
    </main>

    <footer class="py-12 border-t border-slate-800 bg-slate-950/50 text-center w-full mt-auto">
        <p class="text-gray-600 text-[10px] uppercase tracking-[0.3em] font-medium">&copy; 2026 LVLUP Games. Built for the community.</p>
    </footer>

</body>
</html>
