<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEVEL UP! Happy Birthday</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; overflow-x: hidden; }
        .gamer-font { font-family: 'Rajdhani', sans-serif; }
        .float { animation: floating 3s ease-in-out infinite; }
        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        .confetti { position: absolute; width: 10px; height: 10px; background: #8b5cf6; opacity: 0.7; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen relative overflow-hidden">

    <div class="absolute top-0 left-0 w-full h-full opacity-20 pointer-events-none">
        <div class="absolute top-10 left-10 w-64 h-64 bg-violet-600 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-10 right-10 w-64 h-64 bg-blue-600 rounded-full blur-[120px]"></div>
    </div>

    <div class="z-10 text-center px-6">
        <div class="float mb-8">
             <span class="bg-violet-600 text-white px-4 py-1 rounded-full text-xs font-bold uppercase tracking-widest">New Achievement Unlocked</span>
        </div>
        
        <h1 class="gamer-font text-6xl md:text-8xl font-bold mb-4 tracking-tighter">
            HAPPY BIRTHDAY, <span class="text-violet-500">YAAAANG!</span>
        </h1>
        
        <p class="text-xl text-gray-400 mb-12">You've successfully reached <span class="text-white font-bold text-2xl">Level 20</span></p>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 max-w-3xl mx-auto mb-12">
            <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                <div class="text-violet-500 font-bold">STRENGTH</div>
                <div class="text-2xl font-bold">99/99</div>
            </div>
            <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                <div class="text-violet-500 font-bold">WISDOM</div>
                <div class="text-2xl font-bold">+100</div>
            </div>
            <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                <div class="text-violet-500 font-bold">CHARISMA</div>
                <div class="text-2xl font-bold">MAX</div>
            </div>
            <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                <div class="text-violet-500 font-bold">LUCK</div>
                <div class="text-2xl font-bold">Infinite</div>
            </div>
        </div>

        <div class="space-y-4">
            <p class="italic text-gray-500">"The greatest co-op partner a gamer could ask for."</p>
            <button onclick="alert('🎁 Your gift is being processed! Check your DM!')" class="bg-gradient-to-r from-violet-600 to-indigo-600 hover:scale-105 transition-transform px-12 py-4 rounded-full font-bold text-xl shadow-lg shadow-violet-500/50">
                OPEN LOOT BOX
            <a href="quest.html" class="inline-block bg-gradient-to-r from-violet-600 to-indigo-600 hover:scale-105 transition-transform px-12 py-4 rounded-full font-bold text-xl shadow-lg shadow-violet-500/50 text-center no-underline text-white">
                OPEN LOOT BOX2
            </a>
            </button>
        </div>
    </div>

</body>
</html>
