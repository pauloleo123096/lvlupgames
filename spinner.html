    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5597393742237061" crossorigin="anonymous"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .font-brand { font-family: 'Rajdhani', sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(139, 92, 246, 0.2); }
        .spin-item { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .active-spin { color: #22d3ee; text-shadow: 0 0 15px rgba(34, 211, 238, 0.5); transform: scale(1.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <nav class="p-6 border-b border-slate-800 bg-slate-900/50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="index.html" class="font-brand text-2xl font-bold text-violet-500 hover:text-cyan-400 transition-colors">LVLUP <span class="text-slate-400">GAMES</span></a>
            <a href="index.html" class="text-sm text-slate-400 hover:text-white uppercase tracking-widest">Dashboard</a>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-12 max-w-2xl">
        <div class="glass-panel p-8 rounded-3xl shadow-2xl">
            <h1 class="font-brand text-4xl mb-2 text-center uppercase">Loot Spinner</h1>
            <p class="text-slate-400 text-center mb-8 text-sm italic">Define your loot pool and initiate the RNG.</p>

            <div class="space-y-4 mb-8">
                <div class="relative">
                    <input type="text" id="itemInput" placeholder="Enter item name..." 
                           class="w-full bg-slate-900/80 border border-slate-700 rounded-xl py-4 px-6 focus:outline-none focus:border-violet-500 focus:ring-1 focus:ring-violet-500 transition-all text-lg">
                    <button id="addBtn" class="absolute right-2 top-2 bottom-2 px-6 bg-violet-600 hover:bg-violet-500 text-white rounded-lg font-bold transition-colors">ADD</button>
                </div>
                
                <div id="itemList" class="flex flex-wrap gap-2 min-h-[100px] p-4 bg-slate-900/40 rounded-xl border border-dashed border-slate-800">
                    </div>
            </div>

            <div id="displayArea" class="h-32 flex items-center justify-center bg-slate-950 rounded-2xl border-2 border-violet-900/30 mb-8 relative overflow-hidden">
                <div id="winnerText" class="font-brand text-5xl font-black text-slate-700 tracking-tighter uppercase">READY</div>
                <div class="absolute inset-0 pointer-events-none bg-gradient-to-t from-violet-500/5 to-transparent"></div>
            </div>

            <div class="flex flex-col sm:flex-row gap-4">
                <button id="spinBtn" class="flex-1 bg-gradient-to-r from-violet-600 to-cyan-500 hover:from-violet-500 hover:to-cyan-400 text-white font-bold py-4 px-8 rounded-xl shadow-lg shadow-violet-900/20 transition-all transform hover:scale-[1.02] active:scale-95 uppercase tracking-wider">
                    Initiate Spin
                </button>
                
                <button id="copyBtn" class="sm:w-20 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 py-4 px-4 rounded-xl transition-all flex items-center justify-center group" title="Copy List">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 group-hover:text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                    </svg>
                </button>
            </div>
        </div>
    </main>

    <footer class="p-8 text-center text-slate-500 text-xs tracking-widest uppercase">
        &copy; 2026 LVLUP GAMES | <a href="privacy.html" class="hover:text-violet-400">Privacy Policy</a>
    </footer>

    <script>
        const items = [];
        const itemInput = document.getElementById('itemInput');
        const addBtn = document.getElementById('addBtn');
        const itemList = document.getElementById('itemList');
        const winnerText = document.getElementById('winnerText');
        const spinBtn = document.getElementById('spinBtn');
        const copyBtn = document.getElementById('copyBtn');
        let isSpinning = false;

        function updateList() {
            itemList.innerHTML = '';
            items.forEach((item, index) => {
                const tag = document.createElement('div');
                tag.className = 'bg-slate-800 text-slate-300 px-3 py-1 rounded-md text-sm border border-slate-700 flex items-center gap-2 animate-in fade-in zoom-in duration-300';
                tag.innerHTML = `${item} <button onclick="removeItem(${index})" class="text-slate-500 hover:text-red-400">×</button>`;
                itemList.appendChild(tag);
            });
        }

        function removeItem(index) {
            items.splice(index, 1);
            updateList();
        }

        addBtn.addEventListener('click', () => {
            const val = itemInput.value.trim();
            if (val) {
                items.push(val);
                itemInput.value = '';
                updateList();
            }
        });

        itemInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addBtn.click();
        });

        spinBtn.addEventListener('click', () => {
            if (items.length < 2) {
                // YOUR CUSTOM MESSAGE UPDATE
                alert("Add the last one on the list.");
                return;
            }
            if (isSpinning) return;

            isSpinning = true;
            let counter = 0;
            const finalWinner = Math.floor(Math.random() * items.length);
            
            const interval = setInterval(() => {
                winnerText.innerText = items[Math.floor(Math.random() * items.length)];
                winnerText.classList.add('active-spin');
                counter++;

                if (counter > 20) {
                    clearInterval(interval);
                    winnerText.innerText = items[finalWinner];
                    winnerText.classList.add('text-cyan-400');
                    isSpinning = false;
                }
            }, 100);
        });

        // RESTORED COPY LOGIC
        copyBtn.addEventListener('click', () => {
            if (items.length === 0) {
                alert("The list is empty!");
                return;
            }
            const textToCopy = items.join('\n');
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert("List copied to clipboard!");
            });
        });
    </script>
</body>
</html>
