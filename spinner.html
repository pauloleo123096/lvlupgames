<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LVLUP | Loot Spinner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .gamer-font { font-family: 'Rajdhani', sans-serif; }
        canvas { filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.3)); }
        .ad-zone { background: #1e293b; border: 1px dashed #334155; display: flex; align-items: center; justify-content: center; color: #475569; font-size: 0.75rem; text-transform: uppercase; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row">

    <div class="w-full md:w-1/4 p-6 border-r border-slate-800 flex flex-col gap-6">
        <div class="ad-zone h-32 w-full">Ad Space (Top)</div>

        <div class="bg-slate-800/50 p-6 rounded-2xl border border-slate-700 shadow-xl">
            <h2 class="gamer-font text-2xl text-violet-400 mb-4 uppercase tracking-wider font-bold">Entries</h2>
            <textarea id="namesInput" oninput="updateWheel()" class="w-full h-64 bg-slate-900 border border-slate-700 rounded-lg p-4 text-white outline-none focus:border-violet-500 transition-all text-sm" placeholder="Enter names (one per line)">Yang&#10;Player 2&#10;Loot Box&#10;Critical Hit&#10;Game Over&#10;Level Up</textarea>
        </div>

        <div class="ad-zone h-48 w-full mt-auto">Ad Space (Bottom)</div>
    </div>

    <div class="flex-1 flex flex-col items-center justify-center p-6 relative">
        <div class="absolute top-10 text-center">
            <h1 class="gamer-font text-5xl font-bold text-white uppercase tracking-tighter">LOOT <span class="text-violet-500">SPINNER</span></h1>
            <p class="text-gray-500 uppercase tracking-widest text-xs mt-1">Destiny is a spin away</p>
        </div>

        <div class="relative mt-20 scale-90 md:scale-100">
            <div id="arrow" class="absolute -top-4 left-1/2 -translate-x-1/2 z-10 w-0 h-0 border-l-[20px] border-l-transparent border-r-[20px] border-r-transparent border-t-[30px] border-t-white drop-shadow-lg"></div>
            <canvas id="wheelCanvas" width="500" height="500"></canvas>
        </div>

        <button id="spinBtn" onclick="handleAction()" class="mt-10 bg-gradient-to-r from-violet-600 to-indigo-600 hover:scale-110 active:scale-95 transition-all px-16 py-5 rounded-full font-bold text-2xl shadow-xl shadow-violet-500/40 uppercase tracking-widest min-w-[300px]">
            Spin
        </button>
    </div>

    <div class="w-full md:w-1/4 p-6 border-l border-slate-800 flex flex-col bg-slate-900/30">
        <div class="flex justify-between items-center mb-4">
            <h2 class="gamer-font text-2xl text-indigo-400 uppercase tracking-wider font-bold">Chosen Loot</h2>
            <button id="copyBtn" onclick="copyResults()" class="text-[10px] bg-slate-700 hover:bg-violet-600 px-3 py-1 rounded-md transition-colors uppercase font-bold hidden">Copy All</button>
        </div>
        
        <div id="chosenList" class="flex flex-col gap-3 overflow-y-auto max-h-[50vh] pr-2 mb-6">
            <p id="emptyState" class="text-gray-600 italic text-sm text-center mt-10">No winners yet...</p>
        </div>

        <div class="ad-zone flex-1 w-full">Ad Space (Vertical)</div>
    </div>

    <div id="winnerModal" class="fixed inset-0 bg-slate-950/90 hidden flex items-center justify-center z-[100] backdrop-blur-md">
        <div class="text-center p-12 bg-slate-900 rounded-3xl border border-violet-500 shadow-2xl max-w-sm w-full mx-4">
            <h3 class="text-violet-400 uppercase tracking-widest mb-2 font-bold text-sm">Target Acquired:</h3>
            <h2 id="winnerName" class="gamer-font text-5xl text-white mb-8 break-words uppercase">NAME</h2>
            <div class="flex flex-col gap-3">
                <button onclick="removeAndClose()" class="w-full bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white border border-red-600/50 py-3 rounded-xl font-bold transition-all uppercase text-sm tracking-widest">Remove from List</button>
                <button onclick="closeModal()" class="w-full bg-slate-700 hover:bg-slate-600 py-3 rounded-xl font-bold transition-all uppercase text-sm tracking-widest">Keep & Continue</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const namesInput = document.getElementById('namesInput');
        const chosenList = document.getElementById('chosenList');
        const spinBtn = document.getElementById('spinBtn');
        const copyBtn = document.getElementById('copyBtn');
        
        let names = [];
        let winnersArray = [];
        let startAngle = 0;
        let arc = 0;
        let spinTimeout = null;
        let spinAngleStart = 10;
        let spinTime = 0;
        let spinTimeTotal = 0;
        let lastWinner = "";

        const colors = ["#8b5cf6", "#6d28d9", "#4c1d95", "#7c3aed", "#5b21b6", "#1e1b4b"];

        function updateWheel() {
            names = namesInput.value.split('\n').filter(name => name.trim() !== "");
            
            // Toggle Button Mode
            if (names.length === 1) {
                spinBtn.innerText = "Claim Final Loot";
                spinBtn.className = "mt-10 bg-gradient-to-r from-amber-500 to-orange-600 hover:scale-110 active:scale-95 transition-all px-16 py-5 rounded-full font-bold text-2xl shadow-xl shadow-orange-500/40 uppercase tracking-widest min-w-[300px]";
            } else {
                spinBtn.innerText = "Spin";
                spinBtn.className = "mt-10 bg-gradient-to-r from-violet-600 to-indigo-600 hover:scale-110 active:scale-95 transition-all px-16 py-5 rounded-full font-bold text-2xl shadow-xl shadow-violet-500/40 uppercase tracking-widest min-w-[300px]";
            }

            if (names.length === 0) {
                ctx.clearRect(0,0,500,500);
                return;
            }
            
            arc = Math.PI / (names.length / 2);
            ctx.clearRect(0,0,500,500);
            names.forEach((name, i) => {
                const angle = startAngle + i * arc;
                ctx.fillStyle = colors[i % colors.length];
                ctx.beginPath(); ctx.moveTo(250, 250);
                ctx.arc(250, 250, 240, angle, angle + arc, false);
                ctx.lineTo(250, 250); ctx.fill();
                ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2; ctx.stroke();
                ctx.save(); ctx.fillStyle = "white"; ctx.font = 'bold 16px Inter';
                ctx.translate(250 + Math.cos(angle + arc / 2) * 180, 250 + Math.sin(angle + arc / 2) * 180);
                ctx.rotate(angle + arc / 2); ctx.fillText(name, -ctx.measureText(name).width / 2, 0); ctx.restore();
            });
        }

        function handleAction() {
            if (names.length === 1) {
                lastWinner = names[0];
                addToChosenList(lastWinner);
                namesInput.value = "";
                updateWheel();
            } else if (names.length > 1) {
                spin();
            }
        }

        function spin() {
            spinBtn.disabled = true;
            spinAngleStart = Math.random() * 10 + 10;
            spinTime = 0;
            spinTimeTotal = Math.random() * 3000 + 1000; // 1-4 seconds
            rotateWheel();
        }

        function rotateWheel() {
            spinTime += 30;
            if(spinTime >= spinTimeTotal) { stopRotateWheel(); return; }
            const spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
            startAngle += (spinAngle * Math.PI / 180);
            drawWheel();
            spinTimeout = setTimeout(rotateWheel, 30);
        }

        function stopRotateWheel() {
            clearTimeout(spinTimeout);
            spinBtn.disabled = false;
            const degrees = startAngle * 180 / Math.PI + 90;
            const arcd = arc * 180 / Math.PI;
            const index = Math.floor((360 - degrees % 360) / arcd);
            lastWinner = names[index < 0 ? index + names.length : index];
            document.getElementById('winnerName').innerText = lastWinner;
            document.getElementById('winnerModal').classList.remove('hidden');
            addToChosenList(lastWinner);
        }

        function addToChosenList(name) {
            document.getElementById('emptyState').classList.add('hidden');
            copyBtn.classList.remove('hidden');
            winnersArray.push(name);
            const item = document.createElement('div');
            item.className = "bg-slate-800 border-l-4 border-indigo-500 p-3 rounded-r-lg text-sm font-semibold flex justify-between items-center animate-in slide-in-from-right duration-300";
            item.innerHTML = `<span>${name}</span><span class="text-[10px] text-gray-500 uppercase">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>`;
            chosenList.prepend(item);
        }

        function copyResults() {
            if (winnersArray.length === 0) return;
            const textToCopy = winnersArray.map((name, i) => `${i + 1}. ${name}`).join('\n');
            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalText = copyBtn.innerText;
                copyBtn.innerText = "COPIED!";
                setTimeout(() => copyBtn.innerText = originalText, 2000);
            });
        }

        function removeAndClose() {
            const currentNames = namesInput.value.split('\n').filter(n => n.trim() !== "");
            const index = currentNames.indexOf(lastWinner);
            if (index > -1) {
                currentNames.splice(index, 1);
                namesInput.value = currentNames.join('\n');
                updateWheel();
            }
            closeModal();
        }

        function easeOut(t, b, c, d) {
            const ts = (t /= d) * t;
            const tc = ts * t;
            return b + c * (tc + -3 * ts + 3 * t);
        }

        function closeModal() { document.getElementById('winnerModal').classList.add('hidden'); }
        
        updateWheel();
    </script>
</body>
</html>
