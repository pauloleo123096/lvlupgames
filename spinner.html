<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loot Spinner | LVLUP Games</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230f172a%22/><text x=%2250%%22 y=%2260%%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-family=%22'Rajdhani', sans-serif%22 font-weight=%22700%22 font-size=%2255%22 fill=%22%238b5cf6%22>lvl</text><path d=%22M30 15 L50 35 L70 15 L60 15 L60 5 L40 5 L40 15 Z%22 fill=%22%2322d3ee%22/></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; overflow-x: hidden; }
        .font-brand { font-family: 'Rajdhani', sans-serif; }
        
        #wheel {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            border: 8px solid #1e293b;
            position: relative;
            transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1);
            background: conic-gradient(#8b5cf6 0% 50%, #0f172a 50% 100%);
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.15);
        }

        #pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0; 
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 35px solid #ef4444;
            z-index: 20;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row p-6 gap-8 justify-center items-start">

    <div class="w-full md:w-1/2 flex flex-col items-center gap-8 py-10 bg-slate-900/30 rounded-3xl border border-slate-800">
        <div class="relative">
            <div id="pointer"></div>
            <div id="wheel">
                <div class="absolute inset-0 flex items-center justify-center">
                    <div class="w-10 h-10 bg-white rounded-full shadow-2xl border-4 border-slate-950 z-10"></div>
                </div>
            </div>
        </div>
        
        <div class="text-center space-y-2">
            <h2 id="winnerDisplay" class="font-brand text-5xl text-violet-500 uppercase tracking-tighter">READY</h2>
            <p class="text-[10px] text-slate-500 uppercase tracking-[0.3em]">Module: RNG_SPIN_V2.1</p>
        </div>

        <button id="spinBtn" class="w-64 bg-gradient-to-r from-violet-600 to-cyan-500 py-4 rounded-xl font-black uppercase tracking-widest shadow-lg hover:brightness-110 active:scale-95 transition-all">
            Initiate Spin
        </button>
    </div>

    <div class="w-full md:w-[400px] bg-slate-900/50 border border-slate-800 rounded-3xl p-6 flex flex-col h-[600px]">
        <div class="flex justify-between items-center border-b border-slate-800 pb-4 mb-4">
            <h3 class="font-brand text-2xl text-cyan-400">VIP LIST</h3>
            <button id="copyBtn" class="text-slate-500 hover:text-white p-2 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                </svg>
            </button>
        </div>

        <div class="flex gap-2 mb-4">
            <input type="text" id="itemInput" placeholder="Add character/item..." 
                   class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-violet-500">
            <button id="addBtn" class="bg-violet-600 px-6 rounded-lg font-bold hover:bg-violet-500 transition-colors">+</button>
        </div>

        <div id="itemList" class="flex-grow overflow-y-auto custom-scrollbar space-y-2">
            </div>

        <div class="mt-4 pt-4 border-t border-slate-800 text-center">
            <a href="index.html" class="text-[10px] text-slate-600 hover:text-slate-400 uppercase tracking-widest">Return to Dashboard</a>
        </div>
    </div>

    <script>
        let items = [];
        let degree = 0;
        const wheel = document.getElementById('wheel');
        const itemInput = document.getElementById('itemInput');
        const addBtn = document.getElementById('addBtn');
        const itemList = document.getElementById('itemList');
        const winnerDisplay = document.getElementById('winnerDisplay');
        const spinBtn = document.getElementById('spinBtn');
        const copyBtn = document.getElementById('copyBtn');

        function updateList() {
            itemList.innerHTML = '';
            items.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center bg-slate-950 p-3 rounded-lg border border-slate-800 group';
                div.innerHTML = `<span class="text-xs uppercase font-semibold">${item}</span>
                                 <button onclick="remove(${index})" class="text-slate-700 hover:text-red-500 text-[10px]">REMOVE</button>`;
                itemList.appendChild(div);
            });
            
            // Visual wheel update
            if(items.length > 1) {
                const colors = ['#8b5cf6', '#0f172a', '#22d3ee', '#1e293b'];
                let gradient = "conic-gradient(";
                items.forEach((_, i) => {
                    let start = (i / items.length) * 100;
                    let end = ((i + 1) / items.length) * 100;
                    gradient += `${colors[i % colors.length]} ${start}% ${end}%${i === items.length - 1 ? '' : ','}`;
                });
                gradient += ")";
                wheel.style.background = gradient;
            }
        }

        function remove(i) { items.splice(i, 1); updateList(); }

        addBtn.addEventListener('click', () => {
            if(itemInput.value.trim()) {
                items.push(itemInput.value.trim().toUpperCase());
                itemInput.value = '';
                updateList();
            }
        });

        spinBtn.addEventListener('click', () => {
            if (items.length < 2) {
                // EXACT MESSAGE REQUESTED
                alert("Add the last one on the list.");
                return;
            }

            const spinRotation = 3600 + Math.floor(Math.random() * 360);
            degree += spinRotation;
            
            wheel.style.transform = `rotate(${degree}deg)`;
            winnerDisplay.innerText = "SPINNING...";

            setTimeout(() => {
                const actualDegree = degree % 360;
                const index = Math.floor(((360 - actualDegree) % 360) / (360 / items.length));
                winnerDisplay.innerText = items[index];
            }, 4000);
        });

        copyBtn.addEventListener('click', () => {
            if(items.length > 0) {
                navigator.clipboard.writeText(items.join('\n')).then(() => alert("VIP LIST COPIED"));
            }
        });

        itemInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') addBtn.click(); });
    </script>
</body>
</html>
