<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loot Spinner | LVLUP Games</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230f172a%22/><text x=%2250%%22 y=%2260%%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-family=%22'Rajdhani', sans-serif%22 font-weight=%22700%22 font-size=%2255%22 fill=%22%238b5cf6%22>lvl</text><path d=%22M30 15 L50 35 L70 15 L60 15 L60 5 L40 5 L40 15 Z%22 fill=%22%2322d3ee%22/></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .font-brand { font-family: 'Rajdhani', sans-serif; }
        
        .wheel-container {
            width: 400px;
            height: 400px;
            border-radius: 50%;
            border: 10px solid #1e293b;
            position: relative;
            overflow: hidden;
            transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1);
        }

        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #ef4444;
            z-index: 20;
        }

        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(139, 92, 246, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-8">

    <div class="max-w-6xl w-full grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
        
        <div class="flex flex-col items-center gap-8">
            <div class="relative">
                <div class="pointer"></div>
                <div id="wheel" class="wheel-container shadow-2xl shadow-violet-900/20">
                    </div>
            </div>
            
            <div class="text-center">
                <h1 id="result" class="font-brand text-6xl font-black text-violet-500 uppercase tracking-tighter">READY</h1>
            </div>

            <button id="spinBtn" class="w-full max-w-sm bg-gradient-to-r from-violet-600 to-cyan-500 hover:from-violet-500 hover:to-cyan-400 text-white font-black py-5 rounded-2xl shadow-xl transition-all transform active:scale-95 uppercase tracking-[0.2em]">
                Initiate Spin
            </button>
        </div>

        <div class="glass p-8 rounded-3xl h-[600px] flex flex-col">
            <h2 class="font-brand text-3xl mb-6 text-cyan-400">ENTRY LIST</h2>
            
            <div class="flex gap-2 mb-6">
                <input type="text" id="itemInput" placeholder="Add character..." 
                       class="flex-1 bg-slate-900/50 border border-slate-700 rounded-xl px-6 py-4 focus:outline-none focus:border-violet-500">
                <button id="addBtn" class="bg-violet-600 hover:bg-violet-500 px-8 rounded-xl font-bold transition-all">ADD</button>
            </div>

            <div id="listDisplay" class="flex-grow overflow-y-auto space-y-3 pr-2">
                </div>
        </div>

    </div>

    <script>
        let items = [];
        let rotation = 0;
        const wheel = document.getElementById('wheel');
        const input = document.getElementById('itemInput');
        const addBtn = document.getElementById('addBtn');
        const listDisplay = document.getElementById('listDisplay');
        const result = document.getElementById('result');
        const spinBtn = document.getElementById('spinBtn');

        function updateWheel() {
            listDisplay.innerHTML = '';
            items.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center bg-slate-800/40 p-4 rounded-xl border border-slate-700';
                div.innerHTML = `<span class="font-semibold">${item}</span><button onclick="remove(${i})" class="text-slate-500 hover:text-red-400">REMOVE</button>`;
                listDisplay.appendChild(div);
            });

            if (items.length > 0) {
                const colors = ['#8b5cf6', '#0f172a', '#22d3ee', '#1e293b'];
                let gradient = "conic-gradient(";
                items.forEach((_, i) => {
                    let start = (i / items.length) * 100;
                    let end = ((i + 1) / items.length) * 100;
                    gradient += `${colors[i % colors.length]} ${start}% ${end}%${i === items.length - 1 ? '' : ','}`;
                });
                gradient += ")";
                wheel.style.background = gradient;
            }
        }

        function remove(i) {
            items.splice(i, 1);
            updateWheel();
        }

        addBtn.addEventListener('click', () => {
            if (input.value.trim()) {
                items.push(input.value.trim().toUpperCase());
                input.value = '';
                updateWheel();
            }
        });

        spinBtn.addEventListener('click', () => {
            if (items.length < 2) {
                alert("Please add at least two items to spin!");
                return;
            }
            
            const newRotation = 3600 + Math.floor(Math.random() * 360);
            rotation += newRotation;
            wheel.style.transform = `rotate(${rotation}deg)`;
            result.innerText = "SPINNING...";

            setTimeout(() => {
                const actualDegree = rotation % 360;
                const index = Math.floor(((360 - actualDegree) % 360) / (360 / items.length));
                result.innerText = items[index];
            }, 4000);
        });

        input.addEventListener('keypress', (e) => { if(e.key === 'Enter') addBtn.click(); });
    </script>
</body>
</html>
