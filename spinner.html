<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LVLUP | Loot Spinner</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5597393742237061" crossorigin="anonymous"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .gamer-font { font-family: 'Rajdhani', sans-serif; }
        canvas { filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.3)); }
        .ad-container { background: rgba(30, 41, 59, 0.5); border: 1px solid #334155; overflow: hidden; display: flex; justify-content: center; align-items: center; min-height: 90px; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row">

    <div class="w-full md:w-1/4 p-6 border-r border-slate-800 flex flex-col gap-6">
        <div class="ad-container h-32 w-full">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-5597393742237061"
                 data-ad-slot="default"
                 data-ad-format="horizontal"
                 data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>

        <div class="bg-slate-800/50 p-6 rounded-2xl border border-slate-700 shadow-xl">
            <h2 class="gamer-font text-2xl text-violet-400 mb-4 uppercase tracking-wider font-bold">Entries</h2>
            <textarea id="namesInput" oninput="updateWheel()" class="w-full h-64 bg-slate-900 border border-slate-700 rounded-lg p-4 text-white outline-none focus:border-violet-500 transition-all text-sm" placeholder="Enter names...">Yang&#10;Player 2&#10;Loot Box&#10;Critical Hit&#10;Game Over&#10;Level Up</textarea>
        </div>

        <div class="ad-container h-48 w-full mt-auto">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-5597393742237061"
                 data-ad-slot="default"
                 data-ad-format="rectangle"
                 data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
    </div>

    <div class="flex-1 flex flex-col items-center justify-center p-6 relative">
        <div class="absolute top-10 text-center">
            <h1 class="gamer-font text-5xl font-bold text-white uppercase tracking-tighter">LOOT <span class="text-violet-500">SPINNER</span></h1>
            <p class="text-gray-500 uppercase tracking-widest text-xs mt-1">Destiny is a spin away</p>
        </div>

        <div class="relative mt-20 scale-90 md:scale-100">
            <div id="arrow" class="absolute -top-4 left-1/2 -translate-x-1/2 z-10 w-0 h-0 border-l-[20px] border-l-transparent border-r-[20px] border-r-transparent border-t-[30px] border-t-white drop-shadow-lg"></div>
            <canvas id="wheelCanvas" width="500" height="500"></canvas>
        </div>

        <button id="spinBtn" onclick="handleAction()" class="mt-10 bg-gradient-to-r from-violet-600 to-indigo-600 hover:scale-110 active:scale-95 transition-all px-16 py-5 rounded-full font-bold text-2xl shadow-xl shadow-violet-500/40 uppercase tracking-widest min-w-[300px]">
            Spin
        </button>
    </div>

    <div class="w-full md:w-1/4 p-6 border-l border-slate-800 flex flex-col bg-slate-900/30">
        <div class="flex justify-between items-center mb-4">
            <h2 class="gamer-font text-2xl text-indigo-400 uppercase tracking-wider font-bold">Chosen Loot</h2>
            <button id="copyBtn" onclick="copyResults()" class="text-[10px] bg-slate-700 hover:bg-violet-600 px-3 py-1 rounded-md transition-colors uppercase font-bold hidden">Copy All</button>
        </div>
        
        <div id="chosenList" class="flex flex-col gap-3 overflow-y-auto max-h-[50vh] pr-2 mb-6">
            <p id="emptyState" class="text-gray-600 italic text-sm text-center
