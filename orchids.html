<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orchids vs Hecate: Mythos</title>
    <style>
        body {
            margin: 0;
            background: #111;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }
        #game-container {
            position: relative;
            margin-top: 20px;
            box-shadow: 0 0 50px rgba(100,0,150,0.3);
            border: 4px solid #333;
        }
        canvas {
            background: #2a3328; /* Dark mythic grass */
            display: block;
            cursor: crosshair;
        }
        #ui-panel {
            width: 900px;
            height: 80px;
            background: #222;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 20px;
            border-bottom: none;
        }
        .slot {
            width: 80px;
            height: 70px;
            background: #444;
            border: 2px solid #666;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            justify-content: center;
            text-align: center;
            transition: 0.2s;
        }
        .slot:hover { background: #555; }
        .slot.active { border-color: #f1c40f; background: #333; }
        .sun-display {
            font-size: 24px;
            font-weight: bold;
            color: #f1c40f;
            min-width: 100px;
        }
        #controls { margin-top: 10px; display: flex; gap: 10px; }
        button {
            padding: 10px 20px;
            cursor: pointer;
            background: #8e44ad;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 5px;
        }
        button.editor-on { background: #e94560; }
        #spritesheet-preview {
            display: none; /* Set to block if you want to see the generated sheet */
            position: absolute; top: 10px; left: 10px; border: 1px solid red; background: #222;
        }
    </style>
</head>
<body>

    <div id="ui-panel">
        <div class="sun-display">☀️ <span id="sun-count">100</span></div>
        <div class="slot" onclick="selectPlant('golden', 50, this)">
            <div style="color:#f1c40f; font-weight:bold;">Golden</div>
            <span>Oncidium (50)</span>
        </div>
        <div class="slot" onclick="selectPlant('slipper', 100, this)">
            <div style="color:#4ecca3; font-weight:bold;">Slipper</div>
            <span>Orchid (100)</span>
        </div>
        <div class="slot" onclick="selectPlant('bastion', 75, this)">
            <div style="color:#c39bd3; font-weight:bold;">Dendrobium</div>
            <span>Bastion (75)</span>
        </div>
        <div style="margin-left: auto; color: #aaa;">Orchids vs Hecate: Mythos</div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="controls">
        <button id="editorBtn" onclick="toggleEditor()">Editor Mode: OFF</button>
        <span id="status" style="line-height: 40px;">Defend against Hecate's Minions!</span>
    </div>

    <canvas id="spritesheet-preview" width="500" height="300"></canvas>

<script>
/** @type {HTMLCanvasElement} */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const sunDisplay = document.getElementById('sun-count');

// --- 1. PROCEDURAL SPRITESHEET GENERATION ---
// Instead of an external image, we draw the sprites perfectly to an offscreen canvas
const spriteCanvas = document.getElementById('spritesheet-preview');
const sCtx = spriteCanvas.getContext('2d');

function buildSpriteSheet() {
    // 0,0: Golden Oncidium (Sun producer)
    sCtx.save(); sCtx.translate(50, 50);
    sCtx.fillStyle = '#f1c40f';
    for(let i=0; i<5; i++) { sCtx.rotate((Math.PI*2)/5); sCtx.beginPath(); sCtx.ellipse(0, 15, 8, 20, 0, 0, Math.PI*2); sCtx.fill(); sCtx.stroke(); }
    sCtx.fillStyle = '#d35400'; sCtx.beginPath(); sCtx.arc(0, 0, 10, 0, Math.PI*2); sCtx.fill();
    sCtx.restore();

    // 100,0: Slipper Orchid (Shooter)
    sCtx.save(); sCtx.translate(150, 50);
    sCtx.fillStyle = '#27ae60'; sCtx.beginPath(); sCtx.ellipse(-10, 0, 10, 30, 0.5, 0, Math.PI*2); sCtx.fill(); // Leaf
    sCtx.fillStyle = '#8e44ad'; sCtx.beginPath(); sCtx.ellipse(10, 5, 20, 15, 0, 0, Math.PI*2); sCtx.fill(); // Pouch
    sCtx.fillStyle = '#a569bd'; sCtx.beginPath(); sCtx.ellipse(5, -10, 15, 25, -0.3, 0, Math.PI*2); sCtx.fill(); // Top petal
    sCtx.fillStyle = '#2ecc71'; sCtx.beginPath(); sCtx.arc(20, 5, 5, 0, Math.PI*2); sCtx.fill(); // mouth
    sCtx.restore();

    // 200,0: Dendrobium Bastion (Blocker)
    sCtx.save(); sCtx.translate(250, 50);
    sCtx.fillStyle = '#2ecc71'; sCtx.fillRect(-15, 0, 30, 40); // thick stem
    sCtx.fillStyle = '#c39bd3'; 
    sCtx.beginPath(); sCtx.arc(-15, -10, 15, 0, Math.PI*2); sCtx.fill(); sCtx.stroke();
    sCtx.beginPath(); sCtx.arc(15, -5, 15, 0, Math.PI*2); sCtx.fill(); sCtx.stroke();
    sCtx.beginPath(); sCtx.arc(0, -25, 20, 0, Math.PI*2); sCtx.fill(); sCtx.stroke();
    sCtx.restore();

    // 300,0: Sun Drop
    sCtx.save(); sCtx.translate(350, 50);
    sCtx.fillStyle = 'rgba(241, 196, 15, 0.8)';
    sCtx.beginPath(); sCtx.arc(0, 0, 20, 0, Math.PI*2); sCtx.fill();
    sCtx.fillStyle = '#fff'; sCtx.beginPath(); sCtx.arc(-5, -5, 5, 0, Math.PI*2); sCtx.fill();
    sCtx.restore();

    // 400,0: Seed Projectile
    sCtx.save(); sCtx.translate(450, 50);
    sCtx.fillStyle = '#873600';
    sCtx.beginPath(); sCtx.ellipse(0, 0, 12, 8, 0, 0, Math.PI*2); sCtx.fill(); sCtx.stroke();
    sCtx.restore();

    // 0,100 & 100,100: Harpy (2 Frames)
    for(let f=0; f<2; f++) {
        sCtx.save(); sCtx.translate(50 + (f*100), 150);
        sCtx.fillStyle = '#2c3e50'; // Dark body
        sCtx.beginPath(); sCtx.ellipse(0, 0, 20, 30, 0.2, 0, Math.PI*2); sCtx.fill(); // Body
        sCtx.beginPath(); sCtx.arc(-15, -20, 15, 0, Math.PI*2); sCtx.fill(); // Head
        sCtx.fillStyle = '#e74c3c'; sCtx.beginPath(); sCtx.arc(-22, -22, 3, 0, Math.PI*2); sCtx.fill(); // Evil eye
        sCtx.fillStyle = '#f39c12'; sCtx.beginPath(); sCtx.moveTo(-30, -15); sCtx.lineTo(-15, -10); sCtx.lineTo(-15, -20); sCtx.fill(); // Beak
        // Wings flapping
        sCtx.fillStyle = '#34495e';
        if (f === 0) { sCtx.beginPath(); sCtx.ellipse(15, -10, 30, 10, -0.5, 0, Math.PI*2); sCtx.fill(); }
        else { sCtx.beginPath(); sCtx.ellipse(15, 10, 30, 10, 0.5, 0, Math.PI*2); sCtx.fill(); }
        sCtx.restore();
    }

    // 0,200 & 100,200: Minotaur (2 Frames)
    for(let f=0; f<2; f++) {
        sCtx.save(); sCtx.translate(50 + (f*100), 250);
        sCtx.fillStyle = '#17202a'; // Huge dark body
        sCtx.beginPath(); sCtx.roundRect(-30, -20, 60, 60, 10); sCtx.fill(); // Torso
        sCtx.beginPath(); sCtx.arc(-20, -30, 20, 0, Math.PI*2); sCtx.fill(); // Head
        sCtx.fillStyle = '#ecf0f1'; // Horns
        sCtx.beginPath(); sCtx.moveTo(-20, -50); sCtx.quadraticCurveTo(-40, -60, -40, -30); sCtx.stroke();
        sCtx.beginPath(); sCtx.moveTo(-10, -45); sCtx.quadraticCurveTo(10, -60, 10, -30); sCtx.stroke();
        sCtx.fillStyle = '#e74c3c'; sCtx.beginPath(); sCtx.arc(-30, -30, 4, 0, Math.PI*2); sCtx.fill(); // Eye
        // Legs walking
        sCtx.fillStyle = '#17202a';
        if (f === 0) { sCtx.fillRect(-20, 40, 15, 20); sCtx.fillRect(10, 30, 15, 20); }
        else { sCtx.fillRect(-20, 30, 15, 20); sCtx.fillRect(10, 40, 15, 20); }
        sCtx.restore();
    }
}
buildSpriteSheet();

// --- 2. RECORDED SPRITE COORDINATES ---
// We map exactly to the 100x100 grid we just drew above.
const SPRITE_MAP = {
    'golden':  { sx: 0,   sy: 0,   sw: 100, sh: 100 }, 
    'slipper': { sx: 100, sy: 0,   sw: 100, sh: 100 }, 
    'bastion': { sx: 200, sy: 0,   sw: 100, sh: 100 }, 
    'sun':     { sx: 300, sy: 0,   sw: 100, sh: 100 },  
    'seed':    { sx: 400, sy: 0,   sw: 100, sh: 100 },  
    'harpy': [
        { sx: 0,   sy: 100, sw: 100, sh: 100 }, // Frame 1 (Wings Up)
        { sx: 100, sy: 100, sw: 100, sh: 100 }  // Frame 2 (Wings Down)
    ],
    'minotaur': [
        { sx: 0,   sy: 200, sw: 100, sh: 100 }, // Frame 1 (Step Left)
        { sx: 100, sy: 200, sw: 100, sh: 100 }  // Frame 2 (Step Right)
    ]
};

// Game Config
const GRID_ROWS = 5;
const GRID_COLS = 9;
const CELL_SIZE = 100;
canvas.width = GRID_COLS * CELL_SIZE;
canvas.height = GRID_ROWS * CELL_SIZE;

// Game State
let sunPoints = 100;
let selectedPlant = null;
let plantCost = 0;
let isEditorMode = false;
let gameFrame = 0;
let gameOver = false;

const orchids = [];
const minions = [];
const projectiles = [];
const suns = [];
const grid = [];

// Helper function to extract and draw from our procedural spritesheet
function drawSprite(spriteKey, x, y, width, height, frameIndex = 0) {
    let spriteData = SPRITE_MAP[spriteKey];
    if (Array.isArray(spriteData)) {
        spriteData = spriteData[frameIndex % spriteData.length];
    }
    // Draw directly from the hidden canvas
    ctx.drawImage(
        spriteCanvas, 
        spriteData.sx, spriteData.sy, spriteData.sw, spriteData.sh, 
        x, y, width, height                                         
    );
}

// --- Classes ---

class Cell {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.width = CELL_SIZE; this.height = CELL_SIZE;
    }
    draw() {
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        ctx.strokeRect(this.x, this.y, this.width, this.height);
    }
}

class Orchid {
    constructor(x, y, type) {
        this.x = x; this.y = y;
        this.width = CELL_SIZE; this.height = CELL_SIZE;
        this.type = type;
        this.health = type === 'bastion' ? 800 : 100;
        this.timer = 0;
    }
    draw() {
        const yOffset = Math.sin(gameFrame * 0.05 + this.x) * 3; // Breathing animation
        drawSprite(this.type, this.x, this.y + yOffset, this.width, this.height);
        
        // Health bar
        if (this.health < (this.type === 'bastion' ? 800 : 100)) {
            ctx.fillStyle = 'red'; ctx.fillRect(this.x + 20, this.y + 10, 60, 5);
            ctx.fillStyle = 'green'; ctx.fillRect(this.x + 20, this.y + 10, 60 * (this.health / (this.type === 'bastion' ? 800 : 100)), 5);
        }
    }
    update() {
        if (this.type === 'golden') {
            this.timer++;
            if (this.timer % 400 === 0) suns.push(new Sun(this.x + 25, this.y, false));
        }
        if (this.type === 'slipper') {
            this.timer++;
            if (this.timer % 100 === 0 && this.isEnemyInRow()) {
                projectiles.push(new Projectile(this.x + 60, this.y + 30));
            }
        }
    }
    isEnemyInRow() {
        return minions.some(m => Math.abs(m.y - this.y) < 10);
    }
}

class Minion {
    constructor(y, isLarge = false) {
        this.x = canvas.width;
        this.y = y;
        this.type = isLarge ? 'minotaur' : 'harpy';
        this.width = CELL_SIZE;
        this.height = CELL_SIZE;
        this.speed = isLarge ? Math.random() * 0.1 + 0.2 : Math.random() * 0.2 + 0.5;
        this.health = isLarge ? 300 : 100;
        this.maxHealth = this.health;
        this.attackPower = isLarge ? 1 : 0.5;
        this.isAttacking = false;
    }
    draw() {
        const frameIndex = Math.floor(gameFrame / 15); 
        drawSprite(this.type, this.x, this.y, this.width, this.height, frameIndex);
        
        // Health bar
        ctx.fillStyle = 'red'; ctx.fillRect(this.x + 20, this.y + 10, 60, 5);
        ctx.fillStyle = 'orange'; ctx.fillRect(this.x + 20, this.y + 10, 60 * (this.health / this.maxHealth), 5);
    }
    update() {
        this.isAttacking = false;
        for (let i = 0; i < orchids.length; i++) {
            if (this.x < orchids[i].x + CELL_SIZE - 20 && this.x + 50 > orchids[i].x && this.y === orchids[i].y) {
                this.isAttacking = true;
                orchids[i].health -= this.attackPower;
                if (orchids[i].health <= 0) orchids.splice(i, 1);
            }
        }
        if (!this.isAttacking) this.x -= this.speed;
        if (this.x < -50) gameOver = true;
    }
}

class Projectile {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.width = 40; this.height = 40;
        this.speed = 5; this.power = 25;
    }
    update() { this.x += this.speed; }
    draw() { drawSprite('seed', this.x, this.y, this.width, this.height); }
}

class Sun {
    constructor(x, y, isFalling = true) {
        this.x = x; this.y = y;
        this.targetY = isFalling ? Math.random() * (canvas.height - 100) + 50 : y + 20;
        this.isFalling = isFalling;
        this.width = 60; this.height = 60;
        this.timer = 0;
    }
    draw() { drawSprite('sun', this.x, this.y, this.width, this.height); }
    update() {
        if (this.y < this.targetY) this.y += 1;
        this.timer++;
    }
}

// --- Logic ---
for (let y = 0; y < canvas.height; y += CELL_SIZE) {
    for (let x = 0; x < canvas.width; x += CELL_SIZE) grid.push(new Cell(x, y));
}

function handleLogic() {
    // Projectiles
    for (let i = 0; i < projectiles.length; i++) {
        projectiles[i].update(); projectiles[i].draw();
        for (let j = 0; j < minions.length; j++) {
            if (projectiles[i] && projectiles[i].x > minions[j].x + 20 && projectiles[i].x < minions[j].x + 80 && 
                projectiles[i].y > minions[j].y && projectiles[i].y < minions[j].y + 100) {
                minions[j].health -= projectiles[i].power;
                projectiles.splice(i, 1); i--;
                if (minions[j].health <= 0) minions.splice(j, 1);
                break;
            }
        }
        if (projectiles[i] && projectiles[i].x > canvas.width) { projectiles.splice(i, 1); i--; }
    }

    // Suns
    if (gameFrame % 300 === 0) suns.push(new Sun(Math.random() * (canvas.width - 50), -50));
    for (let i = 0; i < suns.length; i++) {
        suns[i].update(); suns[i].draw();
        if (suns[i].timer > 800) { suns.splice(i, 1); i--; }
    }

    // Minions
    for (let i = 0; i < minions.length; i++) { minions[i].update(); minions[i].draw(); }
    if (gameFrame % 400 === 0 && !isEditorMode && gameFrame > 200) {
        let verticalPos = Math.floor(Math.random() * GRID_ROWS) * CELL_SIZE;
        let isLarge = Math.random() > 0.8;
        minions.push(new Minion(verticalPos, isLarge));
    }
}

// --- Interactions ---
function selectPlant(type, cost, el) {
    document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
    selectedPlant = type; plantCost = cost;
    el.classList.add('active');
}

function toggleEditor() {
    isEditorMode = !isEditorMode;
    const btn = document.getElementById('editorBtn');
    btn.innerText = isEditorMode ? "Editor Mode: ON" : "Editor Mode: OFF";
    btn.className = isEditorMode ? "editor-on" : "";
    document.getElementById('status').innerText = isEditorMode ? "L-Click: Harpy | R-Click: Minotaur" : "Defend against Hecate's Minions!";
}

canvas.addEventListener('contextmenu', (e) => {
    e.preventDefault(); 
    if (isEditorMode) {
        const rect = canvas.getBoundingClientRect();
        const gridY = Math.floor((e.clientY - rect.top) / CELL_SIZE) * CELL_SIZE;
        minions.push(new Minion(gridY, true)); 
    }
});

canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left; const mouseY = e.clientY - rect.top;

    // Collect Sun
    for (let i = 0; i < suns.length; i++) {
        if (Math.hypot(mouseX - (suns[i].x + 30), mouseY - (suns[i].y + 30)) < 40) {
            sunPoints += 25; sunDisplay.innerText = sunPoints;
            suns.splice(i, 1); return;
        }
    }

    const gridX = Math.floor(mouseX / CELL_SIZE) * CELL_SIZE;
    const gridY = Math.floor(mouseY / CELL_SIZE) * CELL_SIZE;

    if (isEditorMode) {
        minions.push(new Minion(gridY, false)); 
    } else {
        if (!selectedPlant || sunPoints < plantCost) return;
        if (orchids.some(p => p.x === gridX && p.y === gridY)) return; // Cell occupied

        orchids.push(new Orchid(gridX, gridY, selectedPlant));
        sunPoints -= plantCost; sunDisplay.innerText = sunPoints;
        
        // Deselect after planting for smooth gameplay
        selectedPlant = null;
        document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
    }
});

// --- Main Loop ---
function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    grid.forEach(cell => cell.draw());
    orchids.forEach(o => { o.update(); o.draw(); });
    handleLogic();

    gameFrame++;
    if (!gameOver) {
        requestAnimationFrame(animate);
    } else {
        ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0,0, canvas.width, canvas.height);
        ctx.fillStyle = '#e94560'; ctx.font = 'bold 48px Arial'; ctx.textAlign = 'center';
        ctx.fillText('HECATE HAS CONQUERED', canvas.width/2, canvas.height/2);
        ctx.fillStyle = 'white'; ctx.font = '24px Arial';
        ctx.fillText('Refresh to try again', canvas.width/2, canvas.height/2 + 50);
    }
}
animate();
</script>
</body>
</html>
