<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5597393742237061"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LVLUP | Prank Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .gamer-font { font-family: 'Rajdhani', sans-serif; }
        .input-style { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px; width: 100%; color: white; outline: none; transition: border 0.2s; }
        .input-style:focus { border-color: #8b5cf6; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-12 px-6">

    <div class="max-w-2xl w-full">
        <header class="text-center mb-12">
            <h1 class="gamer-font text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-violet-400 to-indigo-400">QUEST MAKER</h1>
            <p class="text-gray-400 mt-2">Create your own impossible choice prank link.</p>
        </header>

        <div class="bg-slate-800/50 p-8 rounded-2xl border border-slate-700 shadow-xl space-y-6">
            
            <div>
                <label class="block text-sm font-semibold text-violet-300 mb-2 uppercase tracking-wider">Recipient Name</label>
                <input type="text" id="nameInput" placeholder="e.g. Patrixja" class="input-style">
            </div>

            <div>
                <label class="block text-sm font-semibold text-violet-300 mb-2 uppercase tracking-wider">The Big Question</label>
                <input type="text" id="questionInput" placeholder="e.g. Will you be my Player 2?" class="input-style">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-green-400 mb-2 uppercase tracking-wider">Yes Button</label>
                    <input type="text" id="yesInput" placeholder="YES!" class="input-style">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-red-400 mb-2 uppercase tracking-wider">No Button</label>
                    <input type="text" id="noInput" placeholder="NO" class="input-style">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-violet-300 mb-2 uppercase tracking-wider">
                    Victory Message <span class="text-[10px] text-green-400 font-normal ml-2">(PREMIUM - NOW FREE)</span>
                </label>
                <textarea id="victoryInput" placeholder="e.g. You're the best! I knew you'd say yes." class="input-style h-24 resize-none"></textarea>
            </div>

            <button onclick="generateLink()" class="w-full bg-violet-600 hover:bg-violet-700 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-violet-500/20 uppercase tracking-widest">
                Generate Prank Link
            </button>
        </div>

        <div id="resultArea" class="mt-8 hidden animate-in fade-in duration-500">
            <div class="bg-violet-950/30 border border-violet-500/50 p-6 rounded-xl">
                <p class="text-sm text-violet-300 mb-2 font-bold">YOUR CUSTOM LINK:</p>
                <div class="flex gap-2">
                    <input type="text" id="generatedUrl" readonly class="input-style text-sm font-mono text-violet-200">
                    <button onclick="copyLink()" class="bg-slate-700 px-4 rounded-lg hover:bg-slate-600 transition-colors">Copy</button>
                </div>
                <p class="text-xs text-gray-500 mt-4 italic">Send this link to your friend. They'll never be able to click "No"!</p>
            </div>
        </div>
    </div>

    <script>
        function generateLink() {
            const data = {
                n: document.getElementById('nameInput').value || 'Friend',
                q: document.getElementById('questionInput').value || 'Will you be my Player 2?',
                y: document.getElementById('yesInput').value || 'YES!',
                no: document.getElementById('noInput').value || 'NO',
                v: document.getElementById('victoryInput').value || "The best co-op journey begins now!"
            };

            // Enhanced encoding to handle special characters/emojis
            const encodedData = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
            
            const baseUrl = window.location.href.replace('builder.html', 'engine.html');
            const finalUrl = `${baseUrl}?data=${encodedData}`;

            document.getElementById('generatedUrl').value = finalUrl;
            document.getElementById('resultArea').classList.remove('hidden');
        }

        function copyLink() {
            const copyText = document.getElementById("generatedUrl");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            
            // Just a bit of flair for the copy button
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = "Saved!";
            setTimeout(() => { btn.innerText = originalText; }, 2000);
        }
    </script>
</body>
</html>
