<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Quest for Yang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; width: 100vw; }
        .gamer-font { font-family: 'Rajdhani', sans-serif; }
        #no-btn { position: absolute; transition: all 0.15s ease-out; z-index: 50; white-space: nowrap; }
        #yes-btn { transition: all 0.2s ease-in-out; z-index: 60; }
        .confetti { position: absolute; animation: fall 3s linear forwards; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
    </style>
</head>
<body class="flex flex-col items-center justify-center">

    <div id="main-container" class="text-center p-6">
        <h1 class="gamer-font text-4xl md:text-6xl mb-12 uppercase tracking-widest text-violet-400">
            Critical Choice: Will you be my Player 2 forever?
        </h1>
        
        <div class="flex justify-center items-center gap-12 h-64">
            <button id="yes-btn" onclick="victory()" 
                class="bg-green-500 hover:bg-green-400 text-white font-bold py-4 px-10 rounded-full shadow-[0_0_20px_rgba(34,197,94,0.5)] text-2xl">
                YES!
            </button>

            <button id="no-btn" onmouseover="evade()" onclick="evade()"
                class="bg-red-600 text-white font-bold py-4 px-10 rounded-full shadow-lg text-xl">
                NO
            </button>
        </div>
    </div>

    <script>
        let scale = 1;
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');

        function evade() {
            // 1. Move NO button to a random position
            const padding = 100;
            const newX = Math.random() * (window.innerWidth - padding * 2) + padding;
            const newY = Math.random() * (window.innerHeight - padding * 2) + padding;
            
            noBtn.style.left = `${newX}px`;
            noBtn.style.top = `${newY}px`;
            noBtn.style.position = 'fixed';

            // 2. Make YES button bigger
            scale += 0.35;
            yesBtn.style.transform = `scale(${scale})`;

            // 3. Funny text updates
            if (scale > 3) yesBtn.innerText = "CLICK ME!!!";
            if (scale > 6) yesBtn.innerText = "RESISTANCE IS FUTILE";
        }

        function victory() {
            const container = document.getElementById('main-container');
            container.innerHTML = `
                <h1 class="gamer-font text-6xl md:text-8xl text-green-400 animate-bounce mb-4">MATCH FOUND!</h1>
                <p class="text-2xl text-violet-300">Happy Birthday, Yang! You're the best teammate ever.</p>
                <div class="mt-10 text-8xl">🎂🎮✨</div>
            `;
            
            // Celebration Confetti
            for(let i=0; i<100; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.innerText = ['💜', '🎮', '✨', '🎂'][Math.floor(Math.random() * 4)];
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-5vh';
                confetti.style.fontSize = Math.random() * 20 + 20 + 'px';
                confetti.style.animationDuration = Math.random() * 2 + 2 + 's';
                document.body.appendChild(confetti);
            }
        }
    </script>
</body>
</html>
